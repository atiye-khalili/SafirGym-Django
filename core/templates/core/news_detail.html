{% extends 'core/base.html' %}

{% block title %}
    {{ news.title }}
{% endblock %}

{% block main %}
    <h2>{{ news.title }}</h2>

    <small>{{ news.created_at }}</small>

    {% if news.image %}
        <div>
            <img src="{{ news.image.url }}" alt="{{ news.title }}" class="w-100">
        </div>
    {% endif %}

    <p>{{ news.content }}</p>

    <a href="{% url 'news' %}" class="btn btn-secondary">بازگشت به اخبار</a>
{% endblock %}
