{% extends 'core/base.html' %}

{% block title %}
    safir gym
{% endblock %}

{% block main %}
    <h1 class="text-center mt-4">باشگاه ورزشی سفیر</h1>

    {% if firstname %}
        <h3 class="text-center text-success mt-3">
            {{ firstname }} عزیز، به وب‌سایت باشگاه سفیر خوش آمدید
        </h3>
    {% else %}
        <h3 class="text-center mt-3">
            به وب‌سایت باشگاه ورزشی سفیر خوش آمدید
        </h3>
        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="btn btn-primary">ورود</a>
            <a href="{% url 'register' %}" class="btn btn-outline-primary">ثبت نام</a>
        </div>
    {% endif %}
{% endblock %}
