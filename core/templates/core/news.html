{% extends 'core/base.html' %}

{% block title %}
    news
{% endblock %}

{% block main %}
    <h2 class="mt-4">اخبار باشگاه</h2>

    <ul>
        {% for n in news %}
            <li>
                <a href="{% url 'news_detail' news_id=n.id %}">
                    {{ n.title }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
